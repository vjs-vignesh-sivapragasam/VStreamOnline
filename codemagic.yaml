  # ── Android workflows ────────────────────────────────────────────────────────

  tmv-android-build:
    name: TMV Android Build
    environment:
      node: 18
      java: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          node scripts/patch-nodejs-mobile.js

      - name: Extract app version from app.json
        script: |
          if [ -f "app.json" ]; then
            APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.version")
            APP_NAME=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.name.replace(/[^a-zA-Z0-9]/g, '')")
            echo "🤖 App Name: $APP_NAME"
            echo "📋 Version: $APP_VERSION"
            echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
            echo "APP_NAME=$APP_NAME" >> $CM_ENV
          else
            echo "⚠️  app.json not found, using default values"
            echo "APP_VERSION=1.0.0" >> $CM_ENV
            echo "APP_NAME=NetFlix" >> $CM_ENV
          fi

      - name: Clean and generate Android project
        script: |
          set -e
          set -o pipefail
          rm -rf ios android
          npm install -g @expo/cli@latest --force
          npx expo prebuild --platform android

      - name: Setup Android keystore
        script: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "⚠️  No keystore provided, generating self-signed keystore for installable APK"
            KEYSTORE_DIR="$HOME/keystores"
            mkdir -p "$KEYSTORE_DIR"
            AUTO_KEYSTORE="$KEYSTORE_DIR/release.keystore"
            keytool -genkeypair -v \
              -keystore "$AUTO_KEYSTORE" \
              -alias releasekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=NetFlix,OU=Mobile,O=App,L=City,S=State,C=US"
            echo "KEYSTORE_FILE=$AUTO_KEYSTORE" >> $CM_ENV
            echo "KEYSTORE_PASSWORD=android" >> $CM_ENV
            echo "KEYSTORE_ALIAS=releasekey" >> $CM_ENV
            echo "KEYSTORE_KEY_PASSWORD=android" >> $CM_ENV
            echo "UNSIGNED_BUILD=false" >> $CM_ENV
          else
            echo "🔐 Keystore file detected: $KEYSTORE_FILE"
            echo "UNSIGNED_BUILD=false" >> $CM_ENV
          fi

      - name: Build Android release
        script: |
          set -e
          set -o pipefail

          cd android
          if [ "$UNSIGNED_BUILD" = "true" ]; then
            echo "📦 Building unsigned release APK"
            ./gradlew assembleRelease -x configureCMakeRelease -Pandroid.overridePathCheck=true
            BUILD_OUTPUT="app/build/outputs/apk/release"
          else
            echo "📦 Building signed release APK"
            ./gradlew assembleRelease \
              -x configureCMakeRelease \
              -Pandroid.overridePathCheck=true \
              -Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEYSTORE_ALIAS \
              -Pandroid.injected.signing.key.password=$KEYSTORE_KEY_PASSWORD
            BUILD_OUTPUT="app/build/outputs/apk/release"
          fi

          APK_FILE=""
          if [ -f "$BUILD_OUTPUT/app-release.apk" ]; then
            APK_FILE="$BUILD_OUTPUT/app-release.apk"
          elif [ -f "$BUILD_OUTPUT/app-release-unsigned.apk" ]; then
            APK_FILE="$BUILD_OUTPUT/app-release-unsigned.apk"
          else
            APK_FILE=$(find "$BUILD_OUTPUT" -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APK_NAME="${APP_NAME}_v${APP_VERSION}_release.apk"
            cp "$APK_FILE" "../$APK_NAME"
            echo "✅ Release APK created: $APK_NAME"
            APK_SIZE=$(wc -c < "../$APK_NAME" | tr -d ' ')
            echo "📊 APK size: $(ls -lh "../$APK_NAME" | awk '{print $5}') ($APK_SIZE bytes)"
            if [ "$APK_SIZE" -lt 5000000 ]; then
              echo "❌ Error: APK size is suspiciously small ($APK_SIZE bytes)"
              exit 1
            fi
            ln -sf "$APK_NAME" "../latest-release.apk"
          else
            echo "❌ Failed to create release APK"
            exit 1
          fi

      - name: Build Android App Bundle
        script: |
          set -e
          set -o pipefail

          cd android
          if [ "$UNSIGNED_BUILD" = "true" ]; then
            ./gradlew bundleRelease -x configureCMakeRelease -Pandroid.overridePathCheck=true
          else
            ./gradlew bundleRelease \
              -x configureCMakeRelease \
              -Pandroid.overridePathCheck=true \
              -Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEYSTORE_ALIAS \
              -Pandroid.injected.signing.key.password=$KEYSTORE_KEY_PASSWORD
          fi

          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            AAB_NAME="${APP_NAME}_v${APP_VERSION}_release.aab"
            cp "app/build/outputs/bundle/release/app-release.aab" "../$AAB_NAME"
            echo "✅ App Bundle created: $AAB_NAME"
            ln -sf "$AAB_NAME" "../latest-release.aab"
          else
            echo "❌ Failed to create App Bundle"
            exit 1
          fi

    artifacts:
      - "*.apk"
      - "*.aab"
      - android/app/build/outputs/**/*

  tmv-android-dev:
    name: TMV Android Development Build
    environment:
      node: 18
      java: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          node scripts/patch-nodejs-mobile.js

      - name: Extract app version from app.json
        script: |
          if [ -f "app.json" ]; then
            APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.version")
            APP_NAME=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.name.replace(/[^a-zA-Z0-9]/g, '')")
            echo "🤖 App Name: $APP_NAME"
            echo "📋 Version: $APP_VERSION"
            echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
            echo "APP_NAME=$APP_NAME" >> $CM_ENV
          else
            echo "⚠️  app.json not found, using default values"
            echo "APP_VERSION=1.0.0" >> $CM_ENV
            echo "APP_NAME=NetFlix" >> $CM_ENV
          fi

      - name: Clean and generate Android project
        script: |
          set -e
          set -o pipefail
          rm -rf ios android
          npm install -g @expo/cli@latest --force
          npx expo prebuild --platform android

      - name: Build Android debug APK
        script: |
          set -e
          set -o pipefail

          cd android
          ./gradlew assembleDebug -x configureCMakeDebug -Pandroid.overridePathCheck=true

          BUILD_OUTPUT="app/build/outputs/apk/debug"

          if [ -f "$BUILD_OUTPUT/app-debug.apk" ]; then
            APK_NAME="${APP_NAME}_Dev_v${APP_VERSION}_debug.apk"
            cp "$BUILD_OUTPUT/app-debug.apk" "../$APK_NAME"
            echo "✅ Debug APK created: $APK_NAME"
            APK_SIZE=$(wc -c < "../$APK_NAME" | tr -d ' ')
            echo "📊 APK size: $(ls -lh "../$APK_NAME" | awk '{print $5}') ($APK_SIZE bytes)"
            if [ "$APK_SIZE" -lt 5000000 ]; then
              echo "❌ Error: APK size is suspiciously small ($APK_SIZE bytes)"
              exit 1
            fi
            ln -sf "$APK_NAME" "../latest-debug.apk"
          else
            echo "❌ Failed to create debug APK"
            exit 1
          fi

    artifacts:
      - "*.apk"
      - android/app/build/outputs/**/*
