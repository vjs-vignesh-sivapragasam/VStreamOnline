          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Debug \
            -destination generic/platform=iOS \
            -derivedDataPath "build/DerivedData" \
            -archivePath "build/$SCHEME_NAME-dev.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" || {
              echo "⚠️  Archive action failed. Building directly via xcodebuild build..."
              xcodebuild -workspace "$WORKSPACE" \
                -scheme "$SCHEME_NAME" \
                -configuration Debug \
                -destination generic/platform=iOS \
                -sdk iphoneos \
                -derivedDataPath "build/DerivedData" \
