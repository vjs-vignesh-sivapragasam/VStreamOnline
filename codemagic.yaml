          elif [ -d "build/$SCHEME_NAME-dev.xcarchive/Products/Applications" ] && [ -n "$(find "build/$SCHEME_NAME-dev.xcarchive/Products/Applications" -name "*.app" 2>/dev/null | head -1)" ]; then
            APP_PATH=$(find "build/$SCHEME_NAME-dev.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "🔍 Searching in build/DerivedData/Build/Products/Debug-iphoneos..."
            APP_PATH=$(find "build/DerivedData/Build/Products/Debug-iphoneos" -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "🔍 Searching anywhere in build/ for .app..."
            APP_PATH=$(find "build" -name "*.app" -type d 2>/dev/null | grep -i "iphoneos" | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Error: Could not locate built .app bundle! Compilation failed."
            exit 1
          fi

          echo "📱 Found app bundle at: $APP_PATH"
          APP_BUNDLE=$(basename "$APP_PATH")

          rm -rf "build/Payload"
          mkdir -p "build/Payload"
          cp -R "$APP_PATH" "build/Payload/"

          if [ ! -d "build/Payload/$APP_BUNDLE" ]; then
            echo "❌ Error: Failed to copy app bundle into build/Payload!"
