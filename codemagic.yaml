workflows:
  # ── PRODUCTION WORKFLOWS BELOW ───────────────────────────────────────────────

  tmv-ios-build:
    name: TMV iOS Build
    environment:
      node: 18
      xcode: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          node scripts/patch-nodejs-mobile.js
      
      - name: Install Expo CLI
        script: npm install -g @expo/cli@latest --force
      
      - name: Check Expo CLI version
        script: npx expo --version
      
      - name: Extract app version from app.json
        script: |
          if [ -f "app.json" ]; then
            APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.version")
            APP_NAME=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.name.replace(/[^a-zA-Z0-9]/g, '')")
            echo "📱 App Name: $APP_NAME"
            echo "📋 Version: $APP_VERSION"
            echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
            echo "APP_NAME=$APP_NAME" >> $CM_ENV
          else
            echo "⚠️  app.json not found, using default values"
            echo "APP_VERSION=1.0.0" >> $CM_ENV
            echo "APP_NAME=NetFlix" >> $CM_ENV
          fi
      
      - name: Fix expo-updates
        script: |
          mkdir -p node_modules/expo-updates/scripts
          cat > node_modules/expo-updates/scripts/create-manifest-ios.sh << 'EOF2'
          #!/bin/bash
          mkdir -p "${DERIVED_FILE_DIR}" 2>/dev/null || true
          touch "${DERIVED_FILE_DIR}/EXUpdates.generated.m" 2>/dev/null || true
          exit 0
          EOF2
          chmod +x node_modules/expo-updates/scripts/create-manifest-ios.sh
      
      - name: Clean and generate iOS project
        script: |
          rm -rf ios android
          npx expo prebuild --clean --platform ios
          echo "export NODE_OPTIONS=\"--require $(pwd)/scripts/polyfill-node18.js\"" >> ios/.xcode.env.local

      - name: Install iOS dependencies
        script: |
          cd ios
          # Ensure CocoaPods targets have SKIP_INSTALL=YES so archive doesn't fail as generic archive
          ruby -e '
            p = File.read("Podfile")
            unless p.include?("SKIP_INSTALL")
              p += "\npost_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"SKIP_INSTALL\"] = \"YES\"\n    end\n  end\nend\n"
              File.write("Podfile", p)
            end
          '
          pod install --repo-update

      - name: Download Metal Toolchain
        script: |
          echo "⬇️ Downloading Metal Toolchain for KSPlayer shader compilation..."
          xcodebuild -downloadComponent MetalToolchain
          echo "✅ Metal Toolchain ready"
      
      - name: Build with Xcode (unsigned)
        script: |
          set -e
          set -o pipefail

          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found"
            exit 1
          fi
          
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "📱 Building scheme: $SCHEME_NAME"

          rm -rf build
          mkdir -p "build/DerivedData"

          # 1. Archive unsigned with custom DerivedData
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath "build/DerivedData" \
            -archivePath "build/$SCHEME_NAME.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" || {
              echo "⚠️  Archive action failed. Building directly via xcodebuild build..."
              xcodebuild -workspace "$WORKSPACE" \
                -scheme "$SCHEME_NAME" \
                -configuration Release \
                -destination generic/platform=iOS \
                -sdk iphoneos \
                -derivedDataPath "build/DerivedData" \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGNING_ALLOWED=NO \
                build
            }

          # 2. Locate the compiled .app bundle across all output paths
          APP_PATH=""
          if [ -d "build/$SCHEME_NAME.xcarchive/Products/Applications/$SCHEME_NAME.app" ]; then
            APP_PATH="build/$SCHEME_NAME.xcarchive/Products/Applications/$SCHEME_NAME.app"
          elif [ -d "build/$SCHEME_NAME.xcarchive/Products/Applications" ] && [ -n "$(find "build/$SCHEME_NAME.xcarchive/Products/Applications" -name "*.app" 2>/dev/null | head -1)" ]; then
            APP_PATH=$(find "build/$SCHEME_NAME.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "🔍 Searching in build/DerivedData/Build/Products/Release-iphoneos..."
            APP_PATH=$(find "build/DerivedData/Build/Products/Release-iphoneos" -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "🔍 Searching anywhere in build/ for .app..."
            APP_PATH=$(find "build" -name "*.app" -type d 2>/dev/null | grep -i "iphoneos" | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Error: Could not locate built .app bundle! Compilation must have failed."
            exit 1
          fi

          echo "📱 Found app bundle at: $APP_PATH"
          APP_BUNDLE=$(basename "$APP_PATH")

          # 3. Create Payload directory and copy the real .app bundle
          rm -rf "build/Payload"
          mkdir -p "build/Payload"
          cp -R "$APP_PATH" "build/Payload/"

          if [ ! -d "build/Payload/$APP_BUNDLE" ]; then
            echo "❌ Error: Failed to copy app bundle into build/Payload!"
            exit 1
          fi

          IPA_NAME="${APP_NAME}_v${APP_VERSION}"
          echo "📦 Packaging IPA: $IPA_NAME.ipa"

          # 4. Zip Payload to construct the unsigned .ipa
          cd build
          rm -f "$IPA_NAME.ipa"
          zip -r -y "$IPA_NAME.ipa" Payload/

          if [ ! -f "$IPA_NAME.ipa" ]; then
            echo "❌ Error: Failed to create $IPA_NAME.ipa"
            exit 1
          fi

          IPA_SIZE=$(wc -c < "$IPA_NAME.ipa" | tr -d ' ')
          echo "📊 IPA size: $(ls -lh "$IPA_NAME.ipa" | awk '{print $5}') ($IPA_SIZE bytes)"

          # Validate size: a real React Native + KSPlayer IPA is > 10 MB. 160 bytes means empty!
          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "❌ Error: Resulting IPA is suspiciously small ($IPA_SIZE bytes). Build failed."
            exit 1
          fi

          ln -sf "$IPA_NAME.ipa" "latest.ipa"
          echo "✅ Production IPA created successfully: $IPA_NAME.ipa"
    
    artifacts:
      - ios/build/*.ipa
      - ios/build/**/*.xcarchive

